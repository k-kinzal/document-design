name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The palette claims one accessible value per hue on every surface it
      # lands on. A claim a build can check is a claim; one it cannot is a
      # comment.
      - run: npm run check
      - run: npm run build
      - run: npm exec --workspace doc-site -- playwright install --with-deps chromium
      - run: npm test
      - run: npm run build:storybook
      - run: node scripts/pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
