# Product tag pushes generate a report and attach it to the matching release,
# creating a draft when needed. Publish that draft after this workflow and
# the package build succeed. Manual comparisons attach only when requested.
# The action code comes from trusted main, checked out beside the analysed
# tag, so older tags can still be compared. Action report-* tags do not match.
name: Release change report

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      head:
        description: Existing product tag to describe
        required: true
        type: string
      base:
        description: Base tag or commit; empty selects the previous stable version
        required: false
        type: string
      language:
        description: Report language
        type: choice
        options: [en, ja]
        default: en
      attach:
        description: Attach the report to a draft release (creates the draft when no release exists; never publishes)
        type: boolean
        default: false

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Check out the action from main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          path: action
          persist-credentials: false
      - name: Check out the analysed repository with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - id: report
        uses: ./action/actions/release
        with:
          repository-path: target
          head: ${{ inputs.head || github.ref_name }}
          base: ${{ inputs.base }}
          language: ${{ inputs.language || 'en' }}
          report-id: release

  attach:
    needs: report
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.attach)
    concurrency:
      group: release-report-attach-${{ inputs.head || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the publisher from main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          path: action
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - uses: ./action/actions/publish
        with:
          target: release
          source-run-id: ${{ github.run_id }}
          report-id: release
          release-tag: ${{ inputs.head || github.ref_name }}
          generation-result: ${{ needs.report.result }}
          create-draft: true
