# Dogfooding: every push to main is explained by the unreleased action at
# that commit (`uses: ./`). Each push is its own comparison, so runs are not
# cancelled or coalesced. Nothing is committed, released or published from
# here; the report lives in the run's artifacts and Job Summary.
name: Main change report

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Base tag or commit
        required: true
        type: string
      head:
        description: Head tag or commit
        required: true
        type: string
      language:
        description: Report language
        type: choice
        options: [en, ja]
        default: en

permissions: {}

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      # The unreleased action is built from this commit's source, so a push
      # that breaks the generator is found by the push that made it.
      - run: npm ci
      - run: npm run build:report
      - run: npm run check --workspace doc-report
      - id: report
        uses: ./
        with:
          mode: ${{ github.event_name == 'push' && 'push' || 'range' }}
          base: ${{ inputs.base }}
          head: ${{ inputs.head }}
          language: ${{ inputs.language || 'en' }}
          report-id: main
