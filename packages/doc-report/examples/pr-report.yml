# Pull request report with one updatable comment per report id.
#
# The generation job has no write permission; the publish job runs no model
# and no repository code. Fork and draft pull requests are skipped and the
# reason is written to the Job Summary. Pin `uses:` to a full commit SHA of a
# published report-v* tag in your own workflow.
name: PR change report

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

concurrency:
  group: document-design-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - uses: k-kinzal/document-design@report-v1
        with:
          mode: pr
          language: en
          report-id: default

  publish:
    needs: report
    if: >-
      always() && !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      needs.report.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One comment update at a time per pull request and report id. The
    # publisher also re-checks the head before writing.
    concurrency:
      group: document-design-pr-${{ github.event.pull_request.number }}-publish-default
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - uses: k-kinzal/document-design/actions/publish@report-v1
        with:
          target: pr
          source-run-id: ${{ github.run_id }}
          report-id: default
          pr-number: ${{ github.event.pull_request.number }}
          generation-result: ${{ needs.report.result }}

  skipped:
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          {
            echo "## Change report"
            echo
            echo "Skipped: the pull request is a draft or comes from a fork. Reports run for ready pull requests from this repository."
          } >> "$GITHUB_STEP_SUMMARY"
