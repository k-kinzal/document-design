# Report only, on every product tag push. The previous stable vX.Y.Z tag
# that is an ancestor of the pushed tag is the base; the first release is
# described from an empty tree. Nothing is attached or published.
name: Tag change report

on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - uses: k-kinzal/document-design/actions/release@report-v1
        with:
          language: en
