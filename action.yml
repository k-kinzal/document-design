name: document-design change report
description: >-
  Explain a code change as a self-contained HTML report typeset with doc-ui.
  Generated with GitHub Copilot CLI under the caller's GITHUB_TOKEN, validated,
  and uploaded as a browsable workflow artifact.
author: k-kinzal
branding:
  icon: file-text
  color: blue

inputs:
  github-token:
    description: Token for the GitHub API and Copilot CLI. Never written to logs, HTML or the manifest.
    default: ${{ github.token }}
  repository-path:
    description: The checked-out repository to analyse, relative to the workspace.
    default: '.'
  mode:
    description: auto, push, pr or range. auto recognises branch pushes and pull_request events only.
    default: auto
  base:
    description: Explicit base ref (tag, branch or commit). Required for range.
    default: ''
  head:
    description: Explicit head ref. Required for range.
    default: ''
  pr-number:
    description: Pull request number, when not running on a pull_request event.
    default: ''
  language:
    description: Report language, en or ja.
    default: en
  title:
    description: Report title. Defaults to a title built from the repository and the compared revisions.
    default: ''
  instructions:
    description: Additional instructions for the model. Safety, grounding and output rules cannot be overridden.
    default: ''
  model:
    description: Copilot model. The default is auto; the models actually used are recorded in the manifest.
    default: auto
  report-id:
    description: Namespace for several reports on one pull request or run. Letters, digits, - and _ only.
    default: default
  retention-days:
    description: Artifact retention in days (1-90).
    default: '30'
  timeout-seconds:
    description: Total time allowed for model generation, including retries and child processes.
    default: '600'
  max-input-bytes:
    description: UTF-8 size limit of all evidence given to the model.
    default: '200000'
  max-attempts:
    description: Generation attempts including the first one.
    default: '2'
  on-empty:
    description: report (an HTML page saying nothing changed) or skip.
    default: report

outputs:
  status:
    description: complete, partial, empty, skipped or failed.
    value: ${{ steps.finish.outputs.status }}
  has-changes:
    description: true or false once the trees were compared.
    value: ${{ steps.finish.outputs.has-changes }}
  report-path:
    description: Absolute path of the HTML inside this job.
    value: ${{ steps.finish.outputs.report-path }}
  manifest-path:
    description: Absolute path of the manifest inside this job.
    value: ${{ steps.finish.outputs.manifest-path }}
  artifact-id:
    description: Id of the HTML artifact.
    value: ${{ steps.finish.outputs.artifact-id }}
  artifact-url:
    description: URL of the HTML artifact as returned by upload-artifact.
    value: ${{ steps.finish.outputs.artifact-url }}
  manifest-artifact-id:
    description: Id of the manifest artifact.
    value: ${{ steps.finish.outputs.manifest-artifact-id }}
  base-ref:
    description: The base as given or resolved for display.
    value: ${{ steps.finish.outputs.base-ref }}
  head-ref:
    description: The head as given or resolved for display.
    value: ${{ steps.finish.outputs.head-ref }}
  base-sha:
    description: Resolved base commit; empty when the base is the empty tree.
    value: ${{ steps.finish.outputs.base-sha }}
  head-sha:
    description: Resolved head commit.
    value: ${{ steps.finish.outputs.head-sha }}
  base-tree:
    description: Tree the comparison starts from, including the empty tree.
    value: ${{ steps.finish.outputs.base-tree }}
  run-url:
    description: URL of this workflow run.
    value: ${{ steps.finish.outputs.run-url }}
  reason:
    description: Why the report was skipped or failed.
    value: ${{ steps.finish.outputs.reason }}

runs:
  using: composite
  steps:
    - id: generate
      shell: bash
      env:
        DD_REPORT_ACTION_PATH: ${{ github.action_path }}
        DD_REPORT_STATE_DIR: ${{ runner.temp }}/document-design-report/${{ github.action }}
        DD_INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        DD_INPUT_REPOSITORY_PATH: ${{ inputs.repository-path }}
        DD_INPUT_MODE: ${{ inputs.mode }}
        DD_INPUT_BASE: ${{ inputs.base }}
        DD_INPUT_HEAD: ${{ inputs.head }}
        DD_INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        DD_INPUT_LANGUAGE: ${{ inputs.language }}
        DD_INPUT_TITLE: ${{ inputs.title }}
        DD_INPUT_INSTRUCTIONS: ${{ inputs.instructions }}
        DD_INPUT_MODEL: ${{ inputs.model }}
        DD_INPUT_REPORT_ID: ${{ inputs.report-id }}
        DD_INPUT_RETENTION_DAYS: ${{ inputs.retention-days }}
        DD_INPUT_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        DD_INPUT_MAX_INPUT_BYTES: ${{ inputs.max-input-bytes }}
        DD_INPUT_MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        DD_INPUT_ON_EMPTY: ${{ inputs.on-empty }}
      run: |
        major="$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)"
        if [ "$major" -lt 22 ]; then
          echo "::error::document-design report needs Node.js 22 or newer on PATH (found $(node --version 2>/dev/null || echo none)). Add actions/setup-node with node-version: 24 before this step."
          exit 1
        fi
        node "$DD_REPORT_ACTION_PATH/packages/doc-report/dist/report.mjs" generate --mode=auto --report-id=default

    - id: upload
      if: steps.generate.outputs.upload == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: ${{ steps.generate.outputs.report-path }}
        archive: false
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error

    - id: manifest
      if: steps.generate.outputs.upload == 'true'
      shell: bash
      env:
        DD_REPORT_ACTION_PATH: ${{ github.action_path }}
        DD_REPORT_STATE_DIR: ${{ runner.temp }}/document-design-report/${{ github.action }}
        DD_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        DD_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        DD_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
      run: node "$DD_REPORT_ACTION_PATH/packages/doc-report/dist/report.mjs" manifest

    - id: upload-manifest
      if: steps.manifest.outputs.upload == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: ${{ steps.manifest.outputs.manifest-path }}
        archive: false
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error

    - id: finish
      if: always()
      shell: bash
      env:
        DD_REPORT_ACTION_PATH: ${{ github.action_path }}
        DD_REPORT_STATE_DIR: ${{ runner.temp }}/document-design-report/${{ github.action }}
        DD_MANIFEST_ARTIFACT_ID: ${{ steps.upload-manifest.outputs.artifact-id }}
        DD_MANIFEST_ARTIFACT_URL: ${{ steps.upload-manifest.outputs.artifact-url }}
      run: node "$DD_REPORT_ACTION_PATH/packages/doc-report/dist/report.mjs" finish
